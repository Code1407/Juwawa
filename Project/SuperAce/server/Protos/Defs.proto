// 排行榜:玩家信息
RankUserInfo {
	string uid
	string avatar
	string name
	uint32 rank
	uint64 bonus
	uint64 score
	bool get
}

// 客户端领取日榜奖励
CsReceiveDayAwardReq {
}
CsReceiveDayAwardResp {
	int32 code
	uint64 accountDiamond
	uint64 bonus
}

// 客户端领取周榜奖励
CsReceiveWeekAwardReq {
}
CsReceiveWeekAwardResp {
	int32 code
	uint64 accountDiamond
	uint64 bonus
}
// 客户端拉取实时排名
CsGetTodayRealTimeRankReq {
}
CsGetTodayRealTimeRankResp {
	uint64 timestamp
	uint32 timezone
	string uid
