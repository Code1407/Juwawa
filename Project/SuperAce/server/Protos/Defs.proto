	array<RankUserInfo> rankUsers
}

// ---------------- SuperAce ----------------
SuperAceSettings {
	float soundVol
	uint16 lastBetAmountButton
	bool isSpeed
}

SuperAceAccount {
	uint64 diamond
	string avatar
	string nickname
	string uid
}

SuperAceResultItem {
	array<int16> slotResult[20, 20]
	array<uint16> eliminateIndexs[0, 20]
	float multiple
	array<float> multiples[0, 4096]
	array<uint16> changeGoldenIndexs[0, 20]
	array<uint16> copyWildIndexs[0, 20]
	array<float> multipleKinds[9, 9]
}

SuperAceResults {
	uint64 betAmount
	uint64 calculateAmount
	array<SuperAceResultItem> resultItems[0, 128]
	float multiple
	array<float> multiples[0, 4096]
	uint16 freeCount
	array<float> multipleKinds[9, 9]
}

SuperAceEnterData {
	SuperAceAccount account
	bool hasLastResult
	SuperAceResults lastResult
	SuperAceSettings playerSettings
	uint64 runningRoundId
	int32 machineStatus
}

CsSuperAceEnterReq {
}
CsSuperAceEnterResp {
	SuperAceAccount account
	bool hasLastResult
	SuperAceResults lastResult
	SuperAceSettings playerSettings
	uint64 runningRoundId
	int32 machineStatus
}

CsSuperAceBetNormalReq {
	uint64 betAmount
	uint64 calculateAmount
}
CsSuperAceBetNormalResp {
	int32 code
	bool hasResult
	SuperAceResults result
	uint64 roundId
}

CsSuperAceBetFreeReq {
}
CsSuperAceBetFreeResp {
	int32 code
	bool hasResult
	SuperAceResults result
	uint64 roundId
}

CsSuperAceStopRoundReq {
	uint64 roundId
}
CsSuperAceStopRoundResp {
	int32 code
	uint64 accountDiamond
}

CsSuperAceSynchronizeReq {
}
CsSuperAceSynchronizeResp {
	int32 code
	SuperAceEnterData data
}

CsSuperAceUpdateSettingsReq {
	SuperAceSettings playerSettings
}
CsSuperAceUpdateSettingsResp {
	int32 code
	SuperAceSettings playerSettings
}

ScSuperAceRoundStepPush {
	uint64 runningRoundId
	int32 status
	uint64 accountDiamond
}
ScSuperAceAccountUpdatePush {
	uint64 value
	uint64 offset
}

