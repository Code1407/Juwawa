<html lang="en" class="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><!-- <title>位图字体制作工具</title> --><!-- Import Vue 3 --><script src="./libs/vue3.min.js"></script><!-- Import style --><link rel="stylesheet" href="./libs/element-plus/index.min.css"><!-- Import component library --><script src="./libs/element-plus/index.min.js"></script><!-- Import local style --><link rel="stylesheet" href="./style/index.css"></head><body><div><div id="app"><div><el-table :data="list" class="table-container" stripe height="500px" max-height="500px" @dragover.prevent @drop="onDropCallback"><template v-slot:empty><div class="empty-icon"></div></template><el-table-column prop="name" label="文件名" align="center"></el-table-column><el-table-column prop="path" label="图片" align="center"><template #default="scope"><img :src="scope.row.path" @load="onImageLoaded($event, scope.row)"></template></el-table-column><el-table-column label="尺寸" align="center"><template #default="scope">{{ scope.row.width }}×{{ scope.row.height }}</template></el-table-column><el-table-column label="字符" align="center"><template #default="scope"><el-input type="text" v-model="scope.row.basename" :value="scope.row.basename" style="width:40px"></el-input></template></el-table-column><el-table-column label="删除?" align="center"><template #default="scope"><el-button round @click="onBtnRemoveClicked(scope.row)">✖</el-button></template></el-table-column></el-table></div><div style="margin-top:10px;margin-right:10px;text-align:right"><el-button id="btn-save" type="success" @click="onBtnSaveClicked" :disabled="isBtnSaveDisabled">保存</el-button><el-button id="btn-clear" type="danger" @click="onBtnClearClicked" :disabled="isBtnSaveDisabled">清空</el-button></div></div></div></body></html><script src="./index.js"></script>
